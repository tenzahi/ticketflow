spring.application.name=api-gateway
server.port=8080

# --- Routes (US-16) ---
# API publique REST -> ticket-service
spring.cloud.gateway.server.webflux.routes[0].id=ticket-api
spring.cloud.gateway.server.webflux.routes[0].uri=${TICKET_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/**

# Sante de chaque service via le gateway (US-17)
spring.cloud.gateway.server.webflux.routes[1].id=ticket-health
spring.cloud.gateway.server.webflux.routes[1].uri=${TICKET_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/health/ticket
spring.cloud.gateway.server.webflux.routes[1].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[2].id=seat-health
spring.cloud.gateway.server.webflux.routes[2].uri=${SEAT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/health/seat
spring.cloud.gateway.server.webflux.routes[2].filters[0]=SetPath=/actuator/health

spring.cloud.gateway.server.webflux.routes[3].id=bank-health
spring.cloud.gateway.server.webflux.routes[3].uri=${BANK_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/health/bank
spring.cloud.gateway.server.webflux.routes[3].filters[0]=SetPath=/actuator/health

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only