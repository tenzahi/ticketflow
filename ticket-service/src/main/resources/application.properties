server.port=8081
spring.application.name=ticket-service
spring.datasource.url=${TICKET_DB_URL:jdbc:postgresql://localhost:5433/ticket_db}
spring.datasource.username=${TICKET_DB_USER:ticketflow}
spring.datasource.password=${TICKET_DB_PASSWORD:ticketflow}
spring.jpa.hibernate.ddl-auto=update
management.endpoints.web.exposure.include=health,info
server.error.include-message=always
server.error.include-binding-errors=always
