services:
  postgres:
    image: postgres:16
    container_name: ticketflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
